<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Capture ideas before they disappear</p>

      <nav id="navbar">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>

      <button type="button" id="theme-toggle">Toggle Theme</button>
    </header>

    <main>
      <section>
        <h2>Add a note</h2>

        <form id="note-form">
          <label for="note-text">New note</label>

          <textarea
            id="note-text"
            placeholder="Type your note here..."
            rows="5"
          ></textarea>

          <p id="char-count">Characters: 0</p>
          <p id="word-count">Words: 0</p>

          <button type="submit">Add Note</button>
          <button type="button" id="clear-btn">Clear</button>
        </form>
      </section>

      <section>
        <h2>Your notes</h2>

        <p id="note-count">You have 2 notes</p>

        <ul id="notes-list">
          <li class="note">Revise HTML forms</li>
          <li class="note">Push my code to GitHub</li>
        </ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built during Web Foundations</p>
    </footer>
  </body>
</html>
